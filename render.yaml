# Render Free: local SQLite/session data is LOST on restart, redeploy, or sleep.
# This blueprint creates no paid service or disk. External persistent storage is not implemented.
services:
  - type: web
    name: attendance-zalo-notifier
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: DATA_DIR
        value: ./data
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_KEY
        generateValue: true
